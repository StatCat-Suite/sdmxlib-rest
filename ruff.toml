# Deliberately off. With `fix = true`, a bare `ruff check` — from an editor,
# a pre-commit hook, or `just lint` — rewrites source as a side effect of
# *asking* what's wrong, which lands unreviewed churn in unrelated files.
# Reports stay read-only; apply fixes explicitly with `ruff check --fix`
# (which `just fmt` does) or by hand.
fix = false
indent-width = 4
line-length = 120
target-version = "py314"

[format]
docstring-code-format = true
docstring-code-line-length = 88
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[lint]
select = ["ALL"]
ignore = [
  # ── Docstring style conflicts ─────────────────────────────────────────────
  # Google convention uses D211 (no blank before class docstring) + D212 (summary on first line)
  "D203", # one-blank-line-before-class — conflicts with D211
  "D213", # multi-line-summary-second-line — conflicts with D212

  # ── Formatter conflicts ───────────────────────────────────────────────────
  "COM812", # missing-trailing-comma — handled by formatter
  "ISC001", # single-line-implicit-string-concatenation — handled by formatter

  # ── Type annotations ──────────────────────────────────────────────────────
  "FA",     # flake8-future-annotations — Python 3.12+, no __future__ needed

  # ── Docstring style ───────────────────────────────────────────────────────
  "D105", # undocumented-magic-method — dunder methods are self-evident (__iter__, __len__, etc.)
  "D107", # undocumented-public-init — Google style documents __init__ in class docstring

  # ── Boolean trap ──────────────────────────────────────────────────────────
  # Frozen dataclasses with bool fields (is_final: bool = False) trigger these
  "FBT",

  # ── Pylint noise ─────────────────────────────────────────────────────────
  "PLR0911", # too-many-return-statements — dispatch functions are idiomatic with many returns
  "PLR0913", # too-many-arguments — triggered by dataclasses with many fields
  # too-many-positional-arguments. Stable since ruff 0.16 (preview before), so
  # it lights up every FastAPI handler. A route signature IS the dependency
  # declaration — each parameter binds a path segment, query param, header or
  # Depends(), and the framework supplies them all by name. Splitting one to
  # satisfy the rule would mean hiding bindings from FastAPI.
  "PLR0917",
  "PLR2004", # magic-value-comparison — too noisy in practice

  # ── Active development ────────────────────────────────────────────────────
  "TD",  # flake8-todos — don't enforce TODO format during development
  "FIX", # flake8-fixme — same

  # ── Misc ──────────────────────────────────────────────────────────────────
  "B008",   # function-call-in-default-argument — legitimate in some patterns
  "CPY001", # missing-copyright-notice — not used in this project
  "SIM108", # sometimes you might want to use either style
  "ERA001", # commented out code can be noisey for if it is actually dead code
  "S608",   # sql-injection — we validate at system boundaries, not in query construction
  "TC",     # flake8-type-checking — lazy imports in 3.14 will make this unnecessary
]

[lint.per-file-ignores]
# Init files: allow re-exports and unordered imports
"__init__.py" = ["E402", "F401", "I"]
# Tests: skip docstrings, annotations, security checks, and unused-arg checks
"tests/**/*.py" = ["D", "ANN", "S101", "ARG", "SLF001", "PLC0415"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["sdmxlib_rest"]
