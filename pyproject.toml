[project]
name = "sdmxlib-rest"
version = "0.6.4"
description = "Generic SDMX-REST HTTP surface over a sdmxlib LocalRegistry"
readme = "README.md"
# PEP 639 form. The deprecated `license = { text = ... }` table populates the
# legacy `License:` field that some per-component scanners still read, but it is
# mutually exclusive with `license-files` — and Apache-2.0 §4 requires shipping
# the license text, which only `license-files` does. Compliance wins; scanners
# that need the legacy field can read `License-Expression:` or the classifier.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "gabrielgellner", email = "gabrielgellner@gmail.com" }]
requires-python = ">=3.14"
keywords = ["sdmx", "sdmx-rest", "fastapi", "statistical-data", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Derived from what the package actually imports, not inherited from the
# service it was extracted from: no statcatlib (the catalog is reached through
# the CatalogProvider seam), no uvicorn (serving is the consumer's job).
dependencies = [
    # 0.71 refuses a store on another schema instead of emptying it
    # (StatCat-Suite/sdmxlib#57), and 0.72 reads `bundle.manifest.json`, whose
    # token is the cache key. Capped at the next minor while sdmxlib is
    # pre-1.0, where a minor may break.
    "sdmxlib>=0.72,<0.73",
    "attrs>=24",
    "fastapi>=0.115",
    "starlette>=0.40",
    # These floors are sdmxlib 0.70's own, restated: nothing can resolve below
    # them, and nothing is tested below them, so they say what we support rather
    # than lean on inherited luck. Stores sdmxlib 0.70 writes need DuckDB 2,
    # and DuckDB 1.5 cannot open them. Within a major, a DuckDB upgrade is a
    # performance decision, not a correctness risk: sdmxlib's runtime
    # scan-integrity guard refuses a store whose scans lose rows whatever
    # version is installed (their #400).
    "duckdb>=2.0",
    "polars>=2.0",
    "pyarrow>=26",
    "orjson>=3.11",
    "loguru>=0.7",
    # Streaming zip + a faster DEFLATE backend for the CSV export path.
    "isal>=1.8.0",
    "zipstream-ng>=1.9.2",
]

[project.urls]
Homepage = "https://github.com/StatCat-Suite/sdmxlib-rest"
Repository = "https://github.com/StatCat-Suite/sdmxlib-rest"
# No docs site: the README is the documentation.
Documentation = "https://github.com/StatCat-Suite/sdmxlib-rest#readme"
"Issue Tracker" = "https://github.com/StatCat-Suite/sdmxlib-rest/issues"
Changelog = "https://github.com/StatCat-Suite/sdmxlib-rest/blob/main/CHANGELOG.md"

[build-system]
# uv_build ships in lockstep with uv, so this range tracks uv's minors rather
# than naming a version. The upper bound is real: uv_build is pre-1.0 and its
# minors may change build behaviour, so a consumer building the sdist should
# get a backend this package has been built with — but pinning a single minor
# means the bound goes stale every uv release and anyone on a newer uv builds
# with a backend the metadata says is unsupported.
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

# Pin the index to public PyPI at the project level so the lock file is
# portable — a host's user-level uv.toml may point at an authenticated mirror,
# which is fine interactively but absent in CI and container builds.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unregistered marks and config typos are errors, not warnings: a typo'd
# `pytestmark` would otherwise drop a whole file out of `just test` (`-m unit`)
# and an always-failing test in it would pass the gate by never running.
strict = true
# A warning that cannot fail is a warning nobody reads. Keep this list empty;
# an ignore list is where it decays.
filterwarnings = ["error"]
markers = [
  "unit: fast unit tests (no I/O)",
  "bundle: benchmarks against a real bundle (set SDMXLIB_REST_BENCH_BUNDLE); skipped without one",
]

[tool.coverage.run]
source = ["src/sdmxlib_rest"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "httpx2>=2.0",
    # Capped at the next minor for the same reason as pyrefly below: ruff
    # minors stabilise rules, and `select = ["ALL"]` turns each one on.
    "ruff>=0.17.1,<0.18",
    # Capped at the next minor: under `preset = "all"` a pyrefly minor can add
    # a rule, and without a cap it lands in CI unannounced — 1.4 did exactly
    # that with `unknown-attribute-access`. Raise it deliberately, on its own.
    "pyrefly>=1.4.0,<1.5",
]
