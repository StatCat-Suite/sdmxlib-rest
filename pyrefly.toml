# pyrefly.toml — the project's type checker (`just typecheck`, editor LSP).
#
# pyrefly is the only checker. Until October 2026 basedpyright was the source of
# truth over `src/` and pyrefly a second opinion. That meant two checkers to
# satisfy, suppressions written in each one's syntax, and `unused-type-ignore`
# switched off, because neither checker could tell a dead `# type: ignore` from
# one carrying the other's error. ../sdmxlib made the same move.
#
# One checker also brought `tests/` under it, at full strength: there are no
# per-directory subtractions. Most of what that surfaced had one cause.
# Starlette's TestClient is typed against `httpx2`, which was not installed, so
# every client call and response was an implicit `Any` (345 findings). Adding
# `httpx2` cleared them. The rest were fixed in code: untyped test helpers, a
# generator standing in for a context manager, and a bench test of a route
# helper that #6 had deleted.
#
# Re-measuring the subtractions over the wider scope showed three of them near
# zero. Turning those on found a real bug: a wildcard listing dropped every
# reference, because `_urn_str` still called sdmxlib's `urn` as a factory long
# after it became a property.
#
# Keep this at 0 findings. A new one is a real defect, not noise.

# Matches `requires-python` in pyproject.toml.
python-version = "3.14"
python-platform = "linux"
python-interpreter = ".venv/bin/python"

# src-layout. "." is on the search path so tests can import `tests.conftest`,
# as they do at runtime under pytest.
search-path = ["src", "."]
project-includes = ["src", "tests"]
project-excludes = ["**/__pycache__", "**/.venv", "**/node_modules"]

# Governance model, deliberately the same one ruff runs under: turn EVERYTHING
# on, then subtract, with a written reason per subtraction. `preset = "all"`
# enables every error kind at error severity — including the ones pyrefly ships
# at `warn`, which `--min-severity error` would otherwise hide. The upside over
# an allow-list is that a NEW error kind in the next pyrefly release arrives as
# a visible finding instead of silently not running. pyproject.toml caps pyrefly
# below the next minor, so that arrival is a deliberate bump, not a CI surprise.
preset = "all"

[errors]
# ── Subtractions from `preset = "all"` ────────────────────────────────────
# Everything below is off on purpose. Counts are measured over src/ + tests/
# when pyrefly became the only checker; they are the argument, not decoration.
#
# House style, held deliberately:
implicit-bool = false          # 107 — `if not ids:` / `if rows:` is idiomatic Python
unused-call-result = false     #  39 — mostly `conn.execute(...)`, whose return we do not want

# `explicit-any` (84) flags every literal `Any` token, including phantom type
# args like `SdmxUrn[Any]` where the object stays concretely typed and
# body-checking is unaffected. The check we actually want is `implicit-any` — a
# type *degrading* to Any — and that family is on via the preset.
explicit-any = false

# No longer subtracted, each fixed to zero when pyrefly became the only
# checker: `unknown-argument-type` and `unknown-variable-type` (11 between
# them: duck-typed `getattr` calls, untyped JSON walks, and the `_urn_str` bug
# above), and `implicit-reexport` (0).

# Dead suppressions fail the gate: `unused-type-ignore` for the shared
# `# type: ignore` form, and `unused-ignore` (on via the preset) for pyrefly's
# own `# pyrefly: ignore[...]`. So every suppression left is load-bearing.
unused-type-ignore = true

# ── Suppressions that remain ──────────────────────────────────────────────
# Each states its reason at the site. By kind:
# - Deliberate monkey-patching: `middleware/compression.py` patches private
#   `zipfile` internals (3), and `app.py` assigns `app.openapi`, FastAPI's
#   documented way to customise the schema.
# - Messages assembled from untyped registry reads: `routes/metadata.py`
#   `_serialise`, and `routes/structure.py`'s slot-keyed `StructureMessage`.
# - `routes/structure.py::_evolve`: pyrefly's attrs plugin resolves `evolve`'s
#   first argument against a concrete attrs class and has no spelling for "some
#   attrs instance", which is all the `object`-typed artefact helpers can
#   promise. Funnelled through one helper so it costs one suppression.
# - Starlette declares `Response.media_type = None` unannotated (`splice.py`,
#   `responses/empty.py`).
# - `tests/test_cache_control_header.py` passes `None` for the registry and
#   connection the middleware under test never reads.
