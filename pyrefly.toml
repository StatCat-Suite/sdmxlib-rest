# pyrefly.toml — second type-checker + fast editor (nvim LSP) pass.
#
# basedpyright (via `just check` / CI, config in pyproject.toml
# `[tool.basedpyright]`) remains the source of truth. pyrefly runs at FULL
# strength alongside it as an independent second opinion, plus the
# `implicit-any` family that basedpyright only approximates.
#
# Mirrors ../sdmxlib/pyrefly.toml, which reached 0 findings at `preset = "all"`
# with no suppressions. The subtractions below are inherited from that work —
# same house style, same third-party boundaries (duckdb / pyarrow / polars /
# fastapi call sites). Counts in the comments are from THIS repo's first full
# run, not sdmxlib's.
#
# Target is 0 findings, and we are there — so pyrefly is part of `just check`
# alongside basedpyright. See the note at the bottom.

# Match basedpyright's target (pyproject.toml `[tool.basedpyright]`).
python-version = "3.13"
python-platform = "linux"
python-interpreter = ".venv/bin/python"

# src-layout with one package (sdmxlib_rest). Only first-party
# code is checked, mirroring CI's `basedpyright src`. Widen project-includes to
# add "tests" for editor feedback there — expect more implicit-any noise, since
# test fixtures are less annotated.
search-path = ["src"]
project-includes = ["src"]
project-excludes = ["**/__pycache__", "**/.venv", "**/node_modules"]

# Governance model, deliberately the same one ruff runs under: turn EVERYTHING
# on, then subtract, with a written reason per subtraction. `preset = "all"`
# enables every error kind at error severity — including the ones pyrefly ships
# at `warn`, which `--min-severity error` would otherwise hide. The upside over
# an allow-list is that a NEW error kind in the next pyrefly release arrives as
# a visible finding instead of silently not running.
preset = "all"

[errors]
# ── Subtractions from `preset = "all"` ────────────────────────────────────
# Everything below is off on purpose. Measured counts are from the run that
# introduced this config; they are the argument, not decoration.
#
# The bulk rejections are all the same shape — a house style we hold
# deliberately, or third-party boundary noise we don't control:
implicit-bool = false          # 347 — `if not ids:` / `if rows:` is idiomatic Python
unknown-argument-type = false  #  66 — duckdb / pyarrow / polars / fastapi call sites
unknown-variable-type = false  #  30 — same, on the receiving end
unused-call-result = false     #  28 — mostly `conn.execute(...)`, whose return we do not want

# `explicit-any` (99) flags every literal `Any` token, including phantom type
# args like `SdmxUrn[Any]` where the object stays concretely typed and
# body-checking is unaffected. The check we actually want is `implicit-any` — a
# type *degrading* to Any — and that one is on via the preset.
explicit-any = false

# Re-exports through the package `__init__.py` files are the public API
# surface; `implicit-reexport` wants an explicit `as` alias or `__all__` entry
# for each. Worth revisiting as a deliberate API-surface pass — especially for
# `sdmxlib_rest`, now that it is a published library — not as a
# side effect of a checker change.
implicit-reexport = false

# `unused-type-ignore` (4) is not enabled here, and cannot be: pyrefly and
# basedpyright both honour `# type: ignore`, so neither can tell on its own
# whether a comment is dead or is carrying the *other* checker's error. The
# hygiene check lives with basedpyright (`reportUnnecessaryTypeIgnoreComment`),
# and checker-specific suppressions are written in each tool's own syntax so
# they stay attributable.
unused-type-ignore = false

# pyrefly 1.2.0 regression: fires on EVERY lambda whose parameter type came
# from bidirectional inference, even when that inference succeeded. Minimal
# repro — `xs: list[str]; sorted(xs, key=lambda s: s.upper())` reports `s` as
# unknown while happily type-checking `s.upper()`. Python has no lambda
# parameter annotation syntax, so the only "fix" is rewriting sort keys as
# named functions to satisfy a diagnostic that is simply wrong. (4 here.)
# Re-check on the next pyrefly release and drop this line when it's fixed.
implicit-any-lambda = false

# ── At zero ───────────────────────────────────────────────────────────────
# The subtractions above take this repo from 659 findings to ~81. That backlog
# was inherited from the extraction rather than written here, and it is now
# burned down: `pyrefly check` reports 0 errors, so `pyrefly` has been added to
# `just check` and is enforced from here on.
#
# What the burn-down actually was, for anyone re-reading the diff: almost all of
# it was bare generics and unannotated empty containers on parsed-JSON and
# artefact-walk locals — `dict` where the code meant `dict[str, Any]`,
# `list[sl.SdmxUrn]` where it meant `list[sl.SdmxUrn[sl.ConceptScheme]]`. Two
# were worth more than an annotation: `_serialise` took an invariant
# `list[object]` no caller could satisfy (now `Sequence[object]`), and
# `_resolve_acreferences` returns `list[Any]` rather than `list[object]`
# BECAUSE its result is splatted into `StructureMessage`'s per-class slots —
# narrowing that one to `object` is what a naive fix does, and it fails.
#
# One suppression remains, in `routes/structure.py::_evolve`: pyrefly's attrs
# plugin resolves `evolve`'s first argument against a concrete attrs class and
# has no spelling for "some attrs instance", which is all the `object`-typed
# artefact helpers can promise. Neither `AttrsInstance` nor `cast` satisfies
# it. The two call sites were funnelled through one helper so it costs one
# `# pyrefly: ignore`, not two. Re-check on the next pyrefly release.
