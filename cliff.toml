[changelog]
# Must match CHANGELOG.md's own header exactly: `git-cliff --prepend` writes
# this header and skips the file's only when the two are identical. A mismatch
# leaves CHANGELOG.md with two headers.
header = """
# Changelog\n
All notable changes to this project are documented here.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
          {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
  # Breaking changes first, in their own group, as sdmxlib and statcatlib parse
  # them. Matched on the conventional-commit `!` marker before the type-based
  # rules, since first match wins; without it a `feat!:` lands under Features.
  { message = "^\\w+(\\([^)]*\\))?!:", group = "Breaking Changes" },
  { message = "^feat", group = "Features" },
  { message = "^model", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^ci", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
  { message = "^Merge", skip = true },
  { message = ".*", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[bump]
# Pre-1.0, a breaking change bumps the minor, not the major (CLAUDE.md,
# Versioning). git-cliff's default proposed 1.0.0 for 0.7.0.
breaking_always_bump_major = false
